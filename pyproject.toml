[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plexiglass"
version = "0.1.0"
description = "Repeatable application security evaluation for LLM prompt injection and synthetic data leakage."
readme = "README.md"
authors = [{ name = "Chi Nok Enoch Kan" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    # Add other relevant classifiers
]
keywords = ["adversarial", "DNN", "LLM"]  # Add more relevant keywords
dependencies = []
requires-python = ">=3.10"

[project.optional-dependencies]
legacy = [
    "torch >= 2.14.1",
    "litellm",
    "detoxify",
    "transformers",
    "accelerate",
    "typer",
    "inquirerpy",
    "datasets",
    "tqdm",
    "langchain<0.2",
    "pandas",
    "typing_extensions",
    "langchain-community<0.1"
]

[project.urls]
Homepage = "https://github.com/w4-advisory/plexiglass"
Issues = "https://github.com/w4-advisory/plexiglass/issues"

[project.scripts]
plx = "plexiglass.app:main"
plx-legacy = "plexiglass.cli:app"

[tool.setuptools.packages.find]
include = ["plexiglass*"]

[tool.setuptools.package-data]
plexiglass = ["version", "config/*.json"]
